<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Conexões</title>

<style>
  body { font-family: system-ui, sans-serif; max-width: 420px; margin: 40px auto; padding: 0 16px; background: #fff; color: #222; }
  h1 { font-size: 20px; margin-bottom: 16px; }
  label { display: block; margin-top: 12px; font-size: 14px; }
  input[type=text], input[type=number], input[type=password], select { width: 100%; padding: 8px; margin-top: 4px; border: 1px solid #999; border-radius: 4px; font-size: 14px; box-sizing: border-box; }
  .check { display: flex; align-items: center; gap: 8px; margin-top: 16px; }
  .botoes { margin-top: 20px; display: flex; gap: 8px; }
  button { padding: 8px 16px; font-size: 14px; border: 1px solid #666; border-radius: 4px; background: #eee; cursor: pointer; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  #msg { margin-top: 16px; font-size: 14px; white-space: pre-wrap; }
  .ok { color: #0a7a2f; }
  .erro { color: #b00020; }
</style>

</head>
<body>

<h1>Nova conexão</h1>

<form id="form" action="/salvar_conexao" method="POST">
  <label>Nome da conexão
    <input type="text" name="nome" placeholder="erp_legado_prod" required>
  </label>

  <label>Tipo de SGBD
    <select name="tipo_sgbd" id="tipo">
      <option value="postgresql">PostgreSQL</option>
      <option value="mysql">MySQL</option>
    </select>
  </label>

  <label>Host
    <input type="text" name="host" placeholder="db01.interno" required>
  </label>

  <label>Porta
    <input type="number" name="porta" id="porta" value="5432" required>
  </label>

  <label>Banco de dados
    <input type="text" name="database" placeholder="meus_dados" required>
  </label>

  <label>Usuário
    <input type="text" name="usuario" required>
  </label>

  <label>Senha
    <input type="password" name="senha" required>
  </label>

  <label class="check">
    <input type="checkbox" name="somente_leitura" value="1">
    Somente leitura
  </label>

  <div class="botoes">
    <button type="button" id="btnTestar">Testar conexão</button>
    <button type="submit" id="btnSalvar" disabled>Salvar conexão</button>
  </div>

  <div id="msg"></div>
</form>

<script>
  const form = document.getElementById('form');
  const btnTestar = document.getElementById('btnTestar');
  const btnSalvar = document.getElementById('btnSalvar');
  const msg = document.getElementById('msg');

  function mostrar(texto, classe) {
    msg.textContent = texto;
    msg.className = classe || '';
  }

  // Trocar o SGBD ajusta a porta padrão
  document.getElementById('tipo').addEventListener('change', e => {
    document.getElementById('porta').value = e.target.value === 'mysql' ? 3306 : 5432;
  });

  // Qualquer alteração exige testar de novo
  form.addEventListener('input', () => { btnSalvar.disabled = true; });
  form.addEventListener('change', () => { btnSalvar.disabled = true; });

  async function enviar(url) {
    const resp = await fetch(url, { method: 'POST', body: new FormData(form) });
    return resp.json();
  }

  btnTestar.addEventListener('click', async () => {
    if (!form.reportValidity()) return;
    btnTestar.disabled = true;
    mostrar('Testando...');
    try {
      const r = await enviar('/testar_conexao');
      if (r.status === 'sucesso') {
        mostrar(r.mensagem, 'ok');
        btnSalvar.disabled = false;
      } else {
        mostrar(r.mensagem, 'erro');
      }
    } catch {
      mostrar('Não foi possível falar com o servidor.', 'erro');
    } finally {
      btnTestar.disabled = false;
    }
  });

  form.addEventListener('submit', async e => {
    e.preventDefault();
    btnSalvar.disabled = true;
    mostrar('Salvando...');
    try {
      const r = await enviar('/salvar_conexao');
      if (r.status === 'sucesso') {
        mostrar(r.mensagem, 'ok');
        form.reset();
      } else {
        mostrar(r.mensagem, 'erro');
        btnSalvar.disabled = false;
      }
    } catch {
      mostrar('Erro ao salvar a conexão.', 'erro');
      btnSalvar.disabled = false;
    }
  });
</script>
</body>
</html>
