<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Listar Conexões</title>

<style>
  body { font-family: system-ui, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px; background: #fff; color: #222; }
  h1 { font-size: 20px; margin-bottom: 16px; }
  .topo { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
  th, td { border: 1px solid #ccc; padding: 8px 12px; text-align: left; }
  th { background: #f5f5f5; }
  .botoes { margin-top: 20px; display: flex; gap: 8px; }
  a, button { text-decoration: none; padding: 8px 16px; font-size: 14px; border: 1px solid #666; border-radius: 4px; background: #eee; color: #222; cursor: pointer; display: inline-block; }
  a:hover, button:hover { background: #e2e2e2; }
  .vazio { margin-top: 20px; font-size: 14px; color: #666; }
</style>

</head>
<body>

<div class="topo">
  <h1>Conexões cadastradas</h1>
  <a href="/cadastrar_conexoes">Nova conexão</a>
</div>

{% if conexoes %}
  <table>
    <thead>
      <tr>
        <th>Usuário</th>
        <th>Banco de Dados</th>
        <th>Base de Dados</th>
        <th>Host</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      {% for c in conexoes %}
      <tr>
        <td>{{ c.nome }}</td>
        <td>{{ c.tipo_sgbd }}</td>
        <td>{{ c.database }}</td>
        <td>{{ c.host }}:{{ c.porta }}</td>
        <td>
          <button type="button" class="btn-apagar" onclick="apagarConexao('{{ c.id }}', '{{ c.nome }}')">Apagar</button>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
{% else %}
  <div class="vazio">Nenhuma conexão cadastrada até o momento.</div>
{% endif %}

</body>

<script>
  async function apagarConexao(id, nome) {
    if (!confirm(`Tem certeza que deseja apagar a conexão "${nome}"?`)) {
      return;
    }

    try {
      const resp = await fetch(`/deletar_conexao/${id}`, {
        method: 'POST'
      });
      const resultado = await resp.json();

      if (resultado.status === 'sucesso') {
        // Recarrega a página para atualizar a lista
        window.location.reload();
      } else {
        alert(resultado.mensagem);
      }
    } catch (erro) {
      alert('Erro ao se comunicar com o servidor.');
    }
  }
</script>

</html>
